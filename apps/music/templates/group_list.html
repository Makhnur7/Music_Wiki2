{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5" style="margin-top: 150px;">
    <div class="section_title text-center mb-65">
        <h3>Список групп</h3>
    </div>
    <style>
        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .card-img-top {
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
        }

        .card-text {
            font-size: 14px;
            color: #555;
        }

        .btn {
            background-color: #007bff;
            color: white;
        }

        .btn:hover {
            background-color: #0056b3;
            color: white;
        }
    </style>
    <div class="row">
        {% for group in groups %}
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                {% if group.image %}
                <img src="{{ group.image.url }}" class="card-img-top" alt="{{ group.name }}" style="height: 200px; object-fit: cover;">
                {% else %}
                <img src="{% static 'img/default_group.png' %}" class="card-img-top" alt="Нет изображения" style="height: 200px; object-fit: cover;">
                {% endif %}
                <div class="card-body">
                    <h5 class="card-title">{{ group.name }}</h5>
                    <p class="card-text">{{ group.description|truncatechars:100 }}</p>
                    <a href="{% url 'music:group_detail' group.id %}" class="btn btn-primary mt-3"  style="color: white;background-color: #001D38;border: #001D38;">Подробнее</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
